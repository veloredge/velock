name: Feature request
description: Suggest a change in behaviour, a setting, or a new interaction.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        VeLock aims to stay tiny: framework APIs only, no dependencies, no battery
        cost while idle. Requests that need an accessibility service, device owner
        rights or root cannot be accepted, see CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the behaviour, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
